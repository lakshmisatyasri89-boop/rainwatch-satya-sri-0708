<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainWatch - Current Weather</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#4facfe,#00f2fe);min-height:100vh;margin:0;display:flex;justify-content:center;align-items:center;color:#123}
.card{background:white;width:min(90%,430px);padding:28px;border-radius:22px;text-align:center;box-shadow:0 12px 35px #0003}
h1{margin-top:0;color:#087ea4}.value{font-size:2.2rem;font-weight:bold;margin:8px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.box{background:#eef9fc;padding:14px;border-radius:14px}
button{border:0;border-radius:12px;padding:12px 20px;background:#087ea4;color:white;font-size:16px;cursor:pointer}
#status{margin:15px 0;font-weight:bold}.small{font-size:13px;color:#667}
</style>
</head>
<body>
<div class="card">
<h1>🌧️ RainWatch</h1>
<p>Live weather-based rainfall prediction</p>
<div id="status">Getting your current location...</div>
<div id="result" style="display:none">
<div class="value" id="rain">--</div>
<div class="info">
<div class="box">🌡️ Temperature<br><b id="temp">--</b></div>
<div class="box">💧 Humidity<br><b id="humidity">--</b></div>
<div class="box">💨 Wind<br><b id="wind">--</b></div>
<div class="box">📍 Location<br><b>Current place</b></div>
</div>
<button onclick="getWeather()">🔄 Refresh</button>
<p class="small">Prediction is based on current weather conditions.</p>
</div></div>
<script>
async function getWeather(){
 const s=document.getElementById("status"), r=document.getElementById("result");
 r.style.display="none"; s.textContent="📍 Finding your current location...";
 if(!navigator.geolocation){s.textContent="❌ Location is not supported.";return;}
 navigator.geolocation.getCurrentPosition(async p=>{
  try{
   const a=p.coords.latitude,b=p.coords.longitude;
   s.textContent="🌦️ Getting current weather...";
   const x=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${a}&longitude=${b}&current=temperature_2m,relative_humidity_2m,precipitation,rain,wind_speed_10m&timezone=auto`);
   const d=await x.json(),c=d.current;
   const rain=Number(c.rain)>0||Number(c.precipitation)>0;
   document.getElementById("rain").textContent=rain?"🌧️ RAIN: YES":"☀️ RAIN: NO";
   document.getElementById("temp").textContent=c.temperature_2m+" °C";
   document.getElementById("humidity").textContent=c.relative_humidity_2m+" %";
   document.getElementById("wind").textContent=c.wind_speed_10m+" km/h";
   s.textContent="✅ Current weather loaded"; r.style.display="block";
  }catch(e){s.textContent="❌ Weather could not be loaded. Check internet.";}
 },()=>{s.textContent="❌ Location denied. Allow location permission and refresh.";});
}
getWeather();
</script>
</body>
</html>
